<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Info</title>
</head>
<body>

    <script>

        class Book {

            constructor(title, author, price) {

                this._title = title;
                this._author = author;
                this._price = price;

            }

            getTitle() {

                return this._title;

            }

            getAuthor() {

                return this._author;

            }

            setPrice(newPrice) {

                if (typeof newPrice === 'number' && newPrice > 0) {
                    this._price = newPrice;
                    console.log(`Price successfully updated to: ${newPrice}`);
                } else {
                    console.log(`Failed to update price to "${newPrice}". Price must be a number greater than 0.`);
                }

            }
        }

        var book1 = new Book("The Alchemist", "Paulo Coelho", 100);

        console.log(" INITIAL BOOK DETAILS :");
        console.log("Title:", book1.getTitle());
        console.log("Author:", book1.getAuthor());
        console.log("Price:", book1._price);

        console.log("\nINVALID PRICE UPDATE (STRING) :");
        book1.setPrice("Two Hundred");

        console.log("\nINVALID PRICE UPDATE (NEGATIVE NUMBER) :");
        book1.setPrice(-5);

        console.log("\n VALID PRICE UPDATE :");
        book1.setPrice(150);

        console.log("\n FINAL BOOK DETAILS :");
        console.log("Title:", book1.getTitle());
        console.log("Author:", book1.getAuthor());
        console.log("Price:", book1._price);

    </script>

</body>
</html>
