<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment System</title>
</head>
<body>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        var comment = " My son is 12 years old. Our flat number is 45 and contact is 9876543210";
        document.getElementById("demo").innerHTML = "<strong>Entered comment : </strong> " + comment;


        document.getElementById("demo1").innerHTML = "<strong>Whether a number was found (true/false):  </strong>" + /\d/g.test(comment);


        var patt1 = /\d/g;
        var result = comment.match(patt1);
        document.getElementById("demo2").innerHTML = "<strong>Accessing the digits from the comment: </strong>"+  result;

        var txt = comment.replace(/\d+/g," NUMBER");
        document.getElementById("demo3").innerHTML = `<strong>Replacing digits with the term 'NUMBER' :</strong>` + txt;

    </script>
</body>
</html>
