<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online store</title>
</head>
<body>
    <p id="first"></p>
    <p id="second"></p>

    <script>
       
        var tShirtSold = 5;
        var tShirtPrice = 400;

        var capSold = 3;
        var capPrice = 150;

        var total = (tShirtSold * tShirtPrice) + (capSold * capPrice);
        document.getElementById("first").innerHTML = "Total cost: " + total;

        var tShirtPrice = 450;
        var total = (tShirtSold * tShirtPrice) + (capSold * capPrice);
        document.getElementById("second").innerHTML = "Updated cost: " + total;

    </script>
</body>
</html>
